services:
  postgres:
    image: postgres:18
    container_name: iosstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iosstore
      POSTGRES_PASSWORD: iosstore
      POSTGRES_DB: iosstore
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: